name: Weekly TMDB Auto-Updater

on:
  schedule:
    # Run at midnight (UTC) every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset & index from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/minilm
          # Download existing files from release 'data' if available
          gh release download data --pattern "healed_tmdb_dataset.csv" || echo "No existing CSV in release; fetcher will initialize if needed."
          gh release download data --pattern "faiss.index" --dir models/minilm || echo "No existing faiss.index in release."
          gh release download data --pattern "index_data.pkl" --dir models/minilm || echo "No existing index_data.pkl in release."

      - name: Run TMDB Fetcher
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python smart_tmdb_fetcher.py

      - name: Update FAISS Index
        run: python update_index.py

      - name: Upload updated dataset & index to GitHub Release (Zero Git LFS quota!)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure release tag 'data' exists, then replace assets with --clobber
          gh release view data || gh release create data --title "Latest TMDB Dataset & AI Indexes" --notes "Weekly automated movie embeddings and dataset"
          gh release upload data healed_tmdb_dataset.csv models/minilm/faiss.index models/minilm/index_data.pkl --clobber

      # Lean Space deploy: one orphan commit with app + index only (no CSV, benches, golden_dataset, etc.).
      # Force-pushing replaces HF history each time — drops old LFS blobs and avoids the 1 GB cap.
      - name: Push lean deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git remote remove huggingface 2>/dev/null || true
          git remote add huggingface "https://uditkumar:${HF_TOKEN}@huggingface.co/spaces/uditkumar/MoviesIndex"
          git branch -D hf-space-deploy 2>/dev/null || true
          git checkout --orphan hf-space-deploy
          git rm -rf --cached . > /dev/null 2>&1
          git add -f Dockerfile requirements.txt README.md \
            app.py data_loader.py data_utils.py \
            .gitattributes \
            templates static \
            models/minilm/faiss.index models/minilm/index_data.pkl
          if git diff --staged --quiet; then
            echo "Nothing staged for HF deploy."
            exit 1
          fi
          git commit -m "chore: lean Space deploy (app + MiniLM index, no CSV)"
          git push huggingface hf-space-deploy:main --force
